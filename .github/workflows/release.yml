name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install media inspection tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffprobe -version
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi

      - name: Test
        run: npm test

      - name: Build browser dependencies
        run: npm run build

      - name: Verify release
        run: npm run release:check

      - name: Package extension
        run: npm run release:package

      - name: Package npm tarball
        run: npm pack --pack-destination dist

      - name: Write verified update manifest
        run: npm run release:manifest

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "docs/releases/${VERSION}.md" ]; then
            cat "docs/releases/${VERSION}.md" > release-notes.md
          else
            printf '# RunningHub Canvas Bridge %s\n' "$VERSION" > release-notes.md
          fi
          cat >> release-notes.md <<EOF

          ---

          RunningHub Canvas Bridge ${VERSION}

          Assets:
          - npm CLI tarball: runninghub-canvas-bridge-${VERSION}.tgz
          - Chrome / Edge extension: runninghub-canvas-bridge-extension-v${VERSION}.zip
          - Codex built-in browser extension: runninghub-canvas-bridge-codex-extension-v${VERSION}.zip
          - Extension checksum: runninghub-canvas-bridge-extension-v${VERSION}.sha256

          Install:
          - GitHub asset: npm install -g ./runninghub-canvas-bridge-${VERSION}.tgz
          - Source: https://github.com/${GITHUB_REPOSITORY}
          - Requires Node.js 22+, ffmpeg/ffprobe and a logged-in supported browser.

          Browser extension:
          1. Download and unzip runninghub-canvas-bridge-extension-v${VERSION}.zip.
          2. For the built-in browser, use its dedicated ZIP and Settings > Browser > Extension manager. For Chrome/Edge, open the browser extension manager.
          3. Enable Developer mode.
          4. Load unpacked and select the unzipped extension directory.
          5. Run runninghub-canvas-bridge doctor.

          Bridge protocol: 1
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RunningHub Canvas Bridge ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*.zip \
            dist/*.sha256 \
            dist/*.tgz \
            dist/update.json
