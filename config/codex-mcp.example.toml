# Replace both paths with absolute paths on your computer.
# Merge this section into ~/.codex/config.toml; do not replace your entire file.
[mcp_servers.runninghub-canvas]
command = "/absolute/path/to/node"
args = ["/absolute/path/to/runninghub-canvas-bridge/server/mcp.mjs"]
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.runninghub-canvas.env]
RH_BRIDGE_URL = "http://127.0.0.1:18765"
